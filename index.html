<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cementix DMS · سيمنتكس</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0E1A24; --ink2:#22384A; --brand:#E8792B; --muted:#8FA2B3; --line:#2B4153; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; color:#fff;
         background: radial-gradient(circle at 25% 15%, var(--ink2), var(--ink) 65%); }
  main { width:min(520px,100%); display:grid; gap:24px; }
  .mark { width:64px; height:64px; border-radius:16px; background:var(--brand); display:grid; place-items:center; font-weight:800; font-size:36px; }
  h1 { margin:0; font-size:34px; } p { margin:4px 0 0; color:var(--muted); letter-spacing:.08em; font-size:13px; }
  a { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 22px; border-radius:14px;
      border:1px solid var(--line); color:#fff; text-decoration:none; background:rgba(255,255,255,.03); transition:border-color .15s, background .15s; }
  a:hover, a:focus-visible { border-color:var(--brand); background:rgba(232,121,43,.08); outline:none; }
  a b { font-size:18px; display:block; } a span { color:var(--muted); font-size:14px; } a i { font-style:normal; color:var(--brand); font-size:22px; }
</style>
</head>
<body>
<main>
  <div>
    <div class="mark">C</div>
    <h1 style="margin-top:16px">سيمنتكس</h1>
    <p>CEMENTIX · DRIVER MANAGEMENT SYSTEM</p>
  </div>
  <a href="./driver"><div><b>تطبيق السائق</b><span>Driver app · التسجيل والرحلات</span></div><i>←</i></a>
  <a href="./admin.html"><div><b>لوحة التحكم</b><span>Control panel · العمليات والاعتماد</span></div><i>←</i></a>
</main>
</body>
</html>
