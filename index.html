<style>
  :root { --ink:#0E1A24; --ink2:#1B3248; --brand:#0066B3; --muted:#8FA2B3; --line:#2B4153; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; color:#fff;
         background: radial-gradient(circle at 25% 15%, var(--ink2), var(--ink) 65%); }
  main { width:min(520px,100%); display:grid; gap:20px; }
  .plate { background:#fff; border-radius:18px; padding:18px 24px; display:flex; justify-content:center; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .plate img { height:120px; width:auto; max-width:100%; }
  p.sub { margin:0; text-align:center; color:var(--muted); letter-spacing:.12em; font-size:12px; font-weight:600; }
  a { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 22px; border-radius:14px;
      border:1px solid var(--line); color:#fff; text-decoration:none; background:rgba(255,255,255,.03); transition:border-color .15s, background .15s; }
  a:hover, a:focus-visible { border-color:var(--brand); background:rgba(0,102,179,.14); outline:none; }
  a b { font-size:18px; display:block; } a span { color:var(--muted); font-size:14px; } a i { font-style:normal; color:#4FA3E3; font-size:22px; }
</style>
