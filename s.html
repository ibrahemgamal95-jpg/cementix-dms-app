<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cementix · تحقق التحميل</title>
<script>
  // Trip QR link: …/s#<trip>-<code> → coordinator scan page, which verifies the loading
  var c = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  location.replace('admin.html#/scan' + (c ? '?code=' + encodeURIComponent(c) : ''));
</script>
</head><body style="font-family:system-ui;text-align:center;padding:40px;background:#fff;color:#0E1A24">
<p>جارٍ فتح صفحة التحقق… <br><a href="admin.html#/scan">اضغط هنا إذا لم تفتح</a></p>
</body></html>
